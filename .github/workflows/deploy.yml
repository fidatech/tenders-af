# After every push to main: install the packages, run the tests, copy the site to the server
# over SSH and run deploy.sh there. The result of every run (tests and deploy) is written to
# the branch "deploy-log", so it can be read without opening GitHub Actions.
#
# Secrets (GitHub > Settings > Secrets and variables > Actions):
#   needed:   SSH_HOST SSH_USER SSH_KEY APP_KEY DB_DATABASE DB_USERNAME DB_PASSWORD ADMIN_EMAIL ADMIN_PASSWORD
#   optional: SSH_PORT (22) APP_DIR (/home/SSH_USER/tenders-af) APP_URL (https://tenders.af) ADMIN_NAME
#             MAIL_USERNAME MAIL_PASSWORD MAIL_HOST (mail.tenders.af) MAIL_PORT (465) MAIL_FROM_ADDRESS
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_DIR: ${{ secrets.APP_DIR || format('/home/{0}/tenders-af', secrets.SSH_USER) }}
      APP_URL: ${{ secrets.APP_URL || 'https://tenders.af' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      # empty until tools/cpanel-setup.sh has run: then only the packages and the tests run
      HAS_SERVER: ${{ secrets.SSH_HOST != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, pdo_mysql, sodium, intl, gd, zip, bcmath, fileinfo
          tools: composer:v2
          coverage: none

      - name: Packages
        run: |
          mkdir -p .logs
          composer install --no-interaction --no-progress --prefer-dist 2>&1 | tee .logs/composer.log

      - name: Tests
        id: tests
        continue-on-error: true
        run: |
          cp .env.example .env
          php artisan key:generate --force
          set -o pipefail
          php artisan test --colors=never 2>&1 | tee .logs/tests.log

      - name: Build for the server
        if: env.HAS_SERVER == 'yes'
        run: |
          rm -f .env
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist
          umask 077
          cat > .env.server <<EOF
          APP_NAME=Tenders.af
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ env.APP_URL }}
          APP_TIMEZONE=Asia/Kabul
          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_MAINTENANCE_DRIVER=file
          REGISTRATION_OPEN=true
          LOG_CHANNEL=daily
          LOG_LEVEL=warning
          DB_CONNECTION=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          SESSION_DRIVER=file
          SESSION_LIFETIME=480
          SESSION_SECURE_COOKIE=true
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          FILESYSTEM_DISK=local
          MAIL_FROM_NAME="Tenders.af"
          EOF
          # email goes out once a mailbox is given (MAIL_USERNAME and MAIL_PASSWORD); until then it is only logged
          if [ -n "${{ secrets.MAIL_USERNAME }}" ]; then
            { echo "MAIL_MAILER=smtp"; echo "MAIL_SCHEME=smtps"
              echo "MAIL_HOST=${{ secrets.MAIL_HOST || 'mail.tenders.af' }}"; echo "MAIL_PORT=${{ secrets.MAIL_PORT || '465' }}"
              echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}"; echo "MAIL_PASSWORD=\"${{ secrets.MAIL_PASSWORD }}\""
              echo "MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS || secrets.MAIL_USERNAME }}"; } >> .env.server
          else
            { echo "MAIL_MAILER=log"; echo "MAIL_FROM_ADDRESS=noreply@tenders.af"; } >> .env.server
          fi
          sed -i 's/^ *//' .env.server
          cat > .deploy-env <<EOF
          ADMIN_NAME="${{ secrets.ADMIN_NAME }}"
          ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}"
          ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"
          EOF
          sed -i 's/^ *//' .deploy-env

      - name: SSH key
        if: env.HAS_SERVER == 'yes'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host server\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  ServerAliveInterval 30\n  LogLevel ERROR\n' \
            "${{ secrets.SSH_HOST }}" "$SSH_PORT" "${{ secrets.SSH_USER }}" > ~/.ssh/config

      - name: Copy to the server and deploy
        if: env.HAS_SERVER == 'yes'
        run: |
          set -o pipefail
          {
            echo "== Copying files"
            # tar over SSH: works on a cPanel account without rsync or scp (jailed shell)
            tar -czf /tmp/site.tgz --exclude='./.git' --exclude='./.github' --exclude='./.logs' --exclude='./node_modules' \
              --exclude='./tests' --exclude='./storage' --exclude='./.env' --exclude='./.env.server' --exclude='./.deploy-env' \
              --exclude='./public/storage' --exclude='./bootstrap/cache/*.php' .
            echo "   package: $(du -h /tmp/site.tgz | cut -f1)"
            ssh server "mkdir -p '$APP_DIR' && rm -rf '$APP_DIR/.incoming' && mkdir '$APP_DIR/.incoming' && tar -xzf - -C '$APP_DIR/.incoming'" < /tmp/site.tgz
            ssh server "cat > '$APP_DIR/.incoming/.env' && chmod 600 '$APP_DIR/.incoming/.env'" < .env.server
            ssh server "cat > '$APP_DIR/.incoming/.deploy-env' && chmod 600 '$APP_DIR/.incoming/.deploy-env'" < .deploy-env
            # swap in the new files; storage/ (uploads, logs) stays where it is
            ssh server "cd '$APP_DIR' && find . -mindepth 1 -maxdepth 1 ! -name storage ! -name .incoming -exec rm -rf {} + && (cd .incoming && tar -cf - .) | tar -xf - && rm -rf .incoming"
            ssh server "cd '$APP_DIR' && bash deploy.sh"
          } 2>&1 | tee .logs/deploy.log

      - name: Check the site
        if: always() && env.HAS_SERVER == 'yes'
        run: |
          for path in / /tenders /companies /register /login /admin/login /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$APP_URL$path" || echo 000)
            echo "$code  $path"
          done | tee .logs/site.log
          for host in http://tender.af https://tender.af https://www.tenders.af; do
            echo "$(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' --max-time 15 "$host/tenders" || echo 'no answer')  $host/tenders"
          done | tee -a .logs/site.log
          echo "-- verification tags on $APP_URL/" | tee -a .logs/site.log
          (curl -s --max-time 20 "$APP_URL/" | grep -oE '<meta name="(google-site-verification|msvalidate.01)"[^>]*>' || echo '(none)') | tee -a .logs/site.log
          ssh server "tail -n 80 '$APP_DIR/storage/logs/laravel-'$(date +%F)'.log' 2>/dev/null || tail -n 80 '$APP_DIR/storage/logs/laravel.log' 2>/dev/null || echo '(no error log)'" > .logs/laravel.log 2>&1 || true

      - name: Write the result to the branch deploy-log
        if: always()
        run: |
          cp composer.lock .logs/ 2>/dev/null || true
          {
            echo "commit:  ${{ github.sha }}"
            echo "run:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "time:    $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "tests:   ${{ steps.tests.outcome }}"
            echo "server:  ${{ env.HAS_SERVER }}"
          } > .logs/summary.txt
          cd .logs
          git init -q -b deploy-log
          git config user.name "deploy"; git config user.email "deploy@tenders.af"
          git add -A && git commit -qm "Deploy of ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy-log
